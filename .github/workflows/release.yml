name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # El CI no corre sobre tags: lo que se publica pasa las pruebas aquí. Van en un job aparte, sin permiso para
  # escribir en el repositorio ni para pedir la identidad con la que se firma: el código de las pruebas (y el de
  # sus dependencias) no se ejecuta donde se puede publicar o firmar.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Analizar
        run: go vet ./...

      - name: Probar
        run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    # Aprobación manual: el environment exige un revisor y solo admite tags v*.*.*.
    environment: release
    permissions:
      contents: write # crear el release
      id-token: write # firma sin llaves (cosign)
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Comprobar la configuración del release
        env:
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          SIGSTORE_OWNER_ID: ${{ vars.SIGSTORE_OWNER_ID }}
          SIGSTORE_CATALOG_REPOSITORY_ID: ${{ vars.SIGSTORE_CATALOG_REPOSITORY_ID }}
          SIGSTORE_RUNTIME_REPOSITORY_IDS: ${{ vars.SIGSTORE_RUNTIME_REPOSITORY_IDS }}
        run: |
          # Sin emisor, `vex bootstrap` no crea confianzas: un release así no sirve. Sin los ids de quien firma el
          # catálogo y las imágenes, el binario no verifica nada (falla cerrado): tampoco sirve.
          for name in OIDC_ISSUER PORTAL_URL BACKEND_URL SIGSTORE_OWNER_ID SIGSTORE_CATALOG_REPOSITORY_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::falta la variable ${name} en el environment release"
              exit 1
            fi
          done
          for name in SIGSTORE_OWNER_ID SIGSTORE_CATALOG_REPOSITORY_ID; do
            case "${!name}" in
              *[!0-9]*) echo "::error::${name} debe ser un id numérico"; exit 1 ;;
            esac
          done
          # Opcional: vex-runtime-a=<id>,vex-runtime-b=<id>
          if [ -n "$SIGSTORE_RUNTIME_REPOSITORY_IDS" ] &&
            ! printf '%s' "$SIGSTORE_RUNTIME_REPOSITORY_IDS" | grep -Eq '^vex-runtime-[a-z0-9-]+=[0-9]+(,vex-runtime-[a-z0-9-]+=[0-9]+)*$'; then
            echo "::error::SIGSTORE_RUNTIME_REPOSITORY_IDS debe ser vex-runtime-x=<id>,vex-runtime-y=<id>"
            exit 1
          fi
          case "$OIDC_ISSUER" in
            https://*) ;;
            *) echo "::error::OIDC_ISSUER debe ser una URL https"; exit 1 ;;
          esac

      - name: Instalar cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Instalar syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          CLI_CLIENT_ID: ${{ secrets.CLI_CLIENT_ID }}
          SIGSTORE_OWNER_ID: ${{ vars.SIGSTORE_OWNER_ID }}
          SIGSTORE_CATALOG_REPOSITORY_ID: ${{ vars.SIGSTORE_CATALOG_REPOSITORY_ID }}
          SIGSTORE_RUNTIME_REPOSITORY_IDS: ${{ vars.SIGSTORE_RUNTIME_REPOSITORY_IDS }}

      - name: Verificar la firma recién creada
        run: |
          version="${GITHUB_REF_NAME#v}"
          cosign verify-blob \
            --bundle "dist/vex_${version}_checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/jairoprogramador/vex/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "dist/vex_${version}_checksums.txt"
          (cd dist && sha256sum --check --ignore-missing "vex_${version}_checksums.txt")

      - name: Hashes para la procedencia
        id: hash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "hashes=$(base64 -w0 < "dist/vex_${version}_checksums.txt")" >> "$GITHUB_OUTPUT"

  provenance:
    needs: release
    permissions:
      actions: read # leer el workflow que generó los artefactos
      id-token: write # firmar la procedencia
      contents: write # subirla al release
    # Excepción documentada a «acciones por SHA»: el generador de SLSA solo se puede referenciar por tag (verifica
    # su propia procedencia a partir de él).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
