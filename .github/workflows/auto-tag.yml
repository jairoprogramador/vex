name: Auto Semantic Version

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Bump version and push tag
        id: versioner
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
          release_branches: main
          default_bump: patch
          custom_release_rules: feat:minor,fix:patch,perf:patch,chore:patch,docs:patch,refactor:patch,style:patch,test:patch,build:patch,ci:patch,BREAKING CHANGE:major
          tag_prefix: v
          dry_run: false
          create_annotated_tag: false

      - name: Debug outputs
        run: |
          echo "New tag: ${{ steps.versioner.outputs.new_tag }}"
          echo "Previous tag: ${{ steps.versioner.outputs.previous_tag }}"
          echo "Bump type: ${{ steps.versioner.outputs.bump }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.versioner.outputs.new_tag != ''
        with:
          tag_name: ${{ steps.versioner.outputs.new_tag }}
          name: Release ${{ steps.versioner.outputs.new_tag }}
          body: ${{ steps.versioner.outputs.changelog }}
