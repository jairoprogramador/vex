version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]
